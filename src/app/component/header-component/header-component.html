<header class="fixed top-0 left-0 w-full z-50 shadow-lg font-sans">

  <!-- TOP BAR -->
  <div
    class="hidden sm:flex h-8 bg-blue-950 text-gray-200 px-4 md:px-8
           text-xs items-center justify-between border-b border-blue-900">

    <div class="flex items-center space-x-4">

      <a
        href="#main-content"
        class="hover:text-sky-300 transition-colors">
        {{ t().SKIP_CONTENT }}
      </a>

      <span class="text-blue-800">|</span>

      <div
        class="flex items-center space-x-1 bg-blue-900/80
               p-0.5 rounded border border-blue-800">

        <span class="text-[10px] text-blue-300 mr-1 pl-1">
          {{ t().TEXT_SIZE }}
        </span>

        <button
          type="button"
          (click)="setFontSize('decrease')"
          [class.bg-white]="fontScale() < 100"
          [class.text-blue-950]="fontScale() < 100"
          class="px-1.5 py-0.5 rounded text-[11px] font-bold
                 hover:bg-blue-800">
          A-
        </button>

        <button
          type="button"
          (click)="setFontSize('reset')"
          [class.bg-white]="fontScale() === 100"
          [class.text-blue-950]="fontScale() === 100"
          class="px-1.5 py-0.5 rounded text-[11px] font-bold
                 hover:bg-blue-800">
          A
        </button>

        <button
          type="button"
          (click)="setFontSize('increase')"
          [class.bg-white]="fontScale() > 100"
          [class.text-blue-950]="fontScale() > 100"
          class="px-1.5 py-0.5 rounded text-[11px] font-bold
                 hover:bg-blue-800">
          A+
        </button>

      </div>
    </div>
  </div>


  <!-- MAIN HEADER -->
  <div
    class="h-16 sm:h-[76px] bg-blue-900 text-white
           px-4 md:px-8 flex items-center justify-between
           border-b border-blue-800/50">

    <!-- LOGO -->
    <div class="flex items-center space-x-2 sm:space-x-3">

      <img
        src="assets/images/logo.jpeg"
        alt="Gramin Bank Logo"
        class="h-9 w-9 sm:h-11 sm:w-11
               bg-white rounded shadow object-cover">

      <div class="flex flex-col">

        <span
          class="text-base sm:text-xl font-extrabold
                 tracking-tight leading-tight whitespace-nowrap">
          CRB .
        </span>

        <span
          class="text-[8px] sm:text-[10px]
                 uppercase tracking-widest text-blue-200">
         Co-Operative And Rural Banking Solution Hub
        </span>

      </div>
    </div>


    <!-- DESKTOP NAV -->
    <nav
      class="hidden lg:flex items-center
             space-x-5 xl:space-x-7 font-medium">

      <a
        href="#home"
        class="hover:text-sky-300 transition-colors
               py-1 border-b-2 border-transparent
               hover:border-sky-300">
        {{ t().HOME }}
      </a>

      <a
        href="#accounts"
        class="hover:text-sky-300 transition-colors
               py-1 border-b-2 border-transparent
               hover:border-sky-300">
        {{ t().ACCOUNTS }}
      </a>

      <a
        href="#loans"
        class="hover:text-sky-300 transition-colors
               py-1 border-b-2 border-transparent
               hover:border-sky-300">
        {{ t().LOANS }}
      </a>

      <!-- <a
        href="#digital-banking"
        class="hover:text-sky-300 transition-colors
               py-1 border-b-2 border-transparent
               hover:border-sky-300">
        {{ t().DIGITAL_BANKING }}
      </a> -->

      <a
        href="#govt-schemes"
        class="hover:text-sky-300 transition-colors
               py-1 border-b-2 border-transparent
               hover:border-sky-300">
        {{ t().GOVT_SCHEMES }}
      </a>

    </nav>


    <!-- RIGHT -->
    <div class="flex items-center space-x-2 sm:space-x-4">

      <!-- BANKING BUTTON -->
      <button
        type="button"
        class="hidden md:flex items-center
               bg-white hover:bg-blue-50
               text-blue-950 px-4 xl:px-5 py-2
               rounded-lg font-bold transition-all
               shadow-md active:scale-95">

        <svg
          class="w-4 h-4 mr-2 text-blue-900"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24">

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M11 16l-4-4m0 0l4-4m-4 4h14
               m-5 4v1a3 3 0 01-3 3H6
               a3 3 0 01-3-3V7a3 3 0 013-3h7
               a3 3 0 013 3v1">
          </path>

        </svg>

        Rural Banking
      </button>


      <!-- MOBILE MENU -->
      <button
        type="button"
        aria-label="Open navigation menu"
        [attr.aria-expanded]="isMobileMenuOpen()"
        (click)="toggleMenu()"
        class="lg:hidden p-2 rounded-lg
               bg-blue-950 hover:bg-blue-800
               text-white border border-blue-700">

        @if (!isMobileMenuOpen()) {

          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24">

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16">
            </path>

          </svg>

        } @else {

          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24">

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12">
            </path>

          </svg>

        }

      </button>

    </div>

  </div>

</header>


<!-- MOBILE OVERLAY -->
@if (isMobileMenuOpen()) {

  <div
    (click)="closeMenu()"
    class="fixed inset-0 bg-blue-950/70
           backdrop-blur-sm z-[60]">
  </div>

}


<!-- MOBILE DRAWER -->

  [class.translate-x-full]="!isMobileMenuOpen()"

         bg-blue-950 text-white
         z-[70] shadow-2xl
         transition-transform duration-300

        src="assets/images/logo.jpeg"

        class="h-9 w-9 bg-white
               rounded-full p-1 object-cover">

      <span class="font-bold text-lg">
        CRB .
      </span>

    </div>

    <button
      type="button"
      (click)="closeMenu()"
      aria-label="Close menu"
      class="p-2 rounded-full
             hover:bg-blue-900
             text-gray-300">

      <svg
        class="w-6 h-6"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24">

        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12">
        </path>

      </svg>

    </button>

  </div>

    <a

<section id="Customer_Support" class="support-section">

  <div class="support-container">

    <!-- ================= LEFT SIDE ================= -->
    <div class="support-content">

      <div class="support-badge">
        <span class="status-dot"></span>
        Customer Support
      </div>

      <h1 class="support-title">
        We Are Ready to
        <span>Solve Your Problem.</span>
      </h1>

      <p class="support-description">
        Our dedicated support team is always ready to help you
        with your banking needs. Get quick assistance and
        reliable solutions whenever you need them.
      </p>

      <!-- Buttons -->
      <div class="support-actions">

        <button
          type="button"
          class="primary-btn"
          (click)="onContactSupport()">

          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2">

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3 5a2 2 0 012-2h2.28a2 2 0 011.94 1.515L10 7a2 2 0 01-.5 1.91l-1.27 1.27a16 16 0 006.59 6.59l1.27-1.27A2 2 0 0118 15l2.485.78A2 2 0 0122 17.72V20a2 2 0 01-2 2C10.059 22 2 13.941 2 4a2 2 0 012-2z">
            </path>

          </svg>

          Contact Support
        </button>


        <!-- <button
          type="button"
          class="secondary-btn"
          (click)="onFindBranch()">

          Find a Branch

          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2">

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 5l7 7-7 7">
            </path>

          </svg>

        </button> -->

      </div>


      <!-- Features -->
      <div class="support-features">

        <div class="feature">
          <span>✓</span>
          Quick Assistance
        </div>

        <div class="feature">
          <span>✓</span>
          Secure Support
        </div>

        <div class="feature">
          <span>✓</span>
          Trusted Service
        </div>

      </div>

    </div>


    <!-- ================= RIGHT SIDE ================= -->
    <div class="support-image-wrapper">

      <!-- Background Circle -->
      <div class="image-circle"></div>

      <!-- Decorative Ring -->
      <div class="image-ring"></div>

      <!-- Human Image -->
      <img
        src="assets/images/support-person.png"
        alt="Customer Support Representative"
        class="support-person">

    </div>

  </div>

</section>
